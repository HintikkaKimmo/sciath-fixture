[project]
name = "sciath-fixtures"
version = "0.1.0"
description = "Generate ground truth fixture JSON from Yocto cve-check output for Sciath validation"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9",
    "rich>=13",
]

[project.scripts]
sciath-fixtures = "sciath_fixtures.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sciath_fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pip-audit>=2.7.0",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["sciath_fixtures"]

[tool.ruff]
target-version = "py310"
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
